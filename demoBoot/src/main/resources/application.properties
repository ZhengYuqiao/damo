dharma.title = dharma java
dharma.teacher = Ashton
dharma.project = spring boot
dharma.number = 15

server.port = 8080

logging.config = classpath:logback-zyq.xml

spring.profiles.active=test

# --- MySQL 数据源（按需在不同环境覆盖） ---
# 例：jdbc:mysql://127.0.0.1:3306/demo_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/demo_boot?useUnicode=true&characterEncoding=utf8&useSSL=false
spring.datasource.username=root
spring.datasource.password=change-me
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# 生产建议用脚本手工建表或接入 Flyway；默认不自动初始化
spring.datasource.initialize=false

# 每月1号9点执行（可按需改）
xinxin.supervision.cron=0 0 9 1 * ?
# 默认提醒“上个月”的对位完成情况：-1 表示上月，0 表示当月
xinxin.supervision.target-month-offset=-1